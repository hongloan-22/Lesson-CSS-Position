
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Dropdown Dọc</title>

    <style>
        /* Định dạng toàn bộ trang web */
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f2f2f2;
        }

        h1 {
            color: #333333;
            margin-bottom: 20px;
        }

        /* Xóa khoảng cách mặc định của danh sách */
        #menu ul {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        /* Định dạng các mục menu */
        #menu li {
            position: relative;
            width: 100px;
            height: 30px;
            padding: 0 20px;
            background-color: black;
            line-height: 30px;
            cursor: pointer;
        }

        /* Định dạng liên kết */
        #menu a {
            color: white;
            text-decoration: none;
            display: block;
        }

        /* Đổi màu nền khi di chuột */
        #menu li:hover {
            background-color: #3498db;
        }

        /* Ẩn menu con mặc định */
        #menu li ul {
            position: absolute;
            top: 0;
            left: 140px;
            visibility: hidden;
        }

        /* Hiển thị menu con khi di chuột vào mục cha */
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>

<body>

    <h1>Menu dọc Dropdown</h1>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>

            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Tư vấn</a></li>
                    <li><a href="#">Hỗ trợ</a></li>
                    <li><a href="#">Bảo hành</a></li>
                </ul>
            </li>

            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
